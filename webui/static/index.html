        function startTaskPolling() {
            if (taskPollingTimer) return; // 已经在轮询

            taskPollingTimer = setInterval(async () => {
                // 第一步：从 ComfyUI 队列获取实时数据
                let comfyuiRunning = [];
                let comfyuiPending = [];
                try {
                    const queueResp = await fetch('/api/comfyui-queue');
                    if (queueResp.ok) {
                        const queueData = await queueResp.json();
                        comfyuiRunning = queueData.running || [];
                        comfyuiPending = queueData.pending || [];
                    }
                } catch (e) {
                    console.error('获取 ComfyUI 队列失败:', e);
                }

                // 建立 prompt_id → comfyui 状态映射
                const comfyuiMap = new Map();
                comfyuiRunning.forEach(item => {
                    if (item.prompt_id) comfyuiMap.set(item.prompt_id, { status: 'running', ...item });
                });
                comfyuiPending.forEach((item, idx) => {
                    if (item.prompt_id) comfyuiMap.set(item.prompt_id, { status: 'queued', position: idx + 1, ...item });
                });

                // 第二步：根据 ComfyUI 队列更新活跃任务状态
                for (const task of activeTasks) {
                    if (task.status === 'completed' || task.status === 'failed' || task.status === 'cancelled') continue;

                    // 查询 DB 获取最新状态
                    try {
                        const response = await fetch(`/api/tasks/${task.id}`);
                        if (!response.ok) continue;

                        const data = await response.json();

                        // 如果 DB 显示已完成/失败，优先使用 DB 状态
                        if (data.status === 'completed' || data.status === 'failed') {
                            task.status = data.status;
                            task.progress = data.progress;
                            if (data.error) task.error = data.error;
                            if (data.comfyui_progress) task.comfyui_progress = data.comfyui_progress;

                            if (data.status === 'completed' && !task.resultShown) {
                                task.resultShown = true;
                                showTaskResult(data);
                            } else if (data.status === 'failed' && !task.errorShown) {
                                task.errorShown = true;
                                showStatus(`❌ 任务失败: ${data.error || '未知错误'}`, 'error');
                            }
                            continue;
                        }

                        // 任务还在活跃状态，检查 ComfyUI 队列
                        // 通过 comfyui_progress 中的 prompt_id 匹配
                        const promptId = task.comfyui_progress?.prompt_id || data.comfyui_progress?.prompt_id;
                        const comfyInfo = promptId ? comfyuiMap.get(promptId) : null;

                        if (comfyInfo) {
                            // 在 ComfyUI 队列中找到
                            if (comfyInfo.status === 'running') {
                                task.status = 'processing';
                                task.comfyui_progress = {
                                    comfyui_status: 'running',
                                    comfyui_percent: comfyInfo.comfyui_percent,
                                    comfyui_current: comfyInfo.comfyui_current,
                                    comfyui_total: comfyInfo.comfyui_total,
                                };
                            } else {
                                task.status = 'queued';
                                task.comfyui_progress = {
                                    comfyui_status: 'queued',
                                    comfyui_position: comfyInfo.position,
                                };
                            }
                        } else {
                            // 不在 ComfyUI 队列中，使用 DB 状态
                            task.status = data.status;
                            if (data.comfyui_progress) task.comfyui_progress = data.comfyui_progress;
                        }

                        task.progress = data.progress;
                        if (data.error) task.error = data.error;

                    } catch (error) {
                        console.error('轮询任务状态失败:', error);
                    }
                }

                // 检查 ComfyUI 队列中有没有我们还没跟踪的任务（从 sync 导入的）
                for (const item of [...comfyuiRunning, ...comfyuiPending]) {
                    if (item.task_id && !activeTasks.find(t => t.id === item.task_id)) {
                        // 发现新任务，加入跟踪
                        activeTasks.push({
                            id: item.task_id,
                            model: item.model || 'Unknown',
                            prompt: item.prompt || '',
                            status: item.status === 'running' ? 'processing' : 'queued',
                            progress: 0,
                            createdAt: new Date().toISOString(),
                            resultShown: false,
                            errorShown: false,
                            comfyui_progress: item.status === 'running' ? {
                                comfyui_status: 'running',
                                comfyui_percent: item.comfyui_percent,
                            } : {
                                comfyui_status: 'queued',
                                comfyui_position: item.position,
                            }
                        });
                    }
                }

                updateTaskList();
                updateTaskCounter();
                saveTasksToStorage();

                const activeCount = activeTasks.filter(t =>
                    t.status !== 'completed' && t.status !== 'failed' && t.status !== 'cancelled'
                ).length;
                if (activeCount === 0) {
                    clearInterval(taskPollingTimer);
                    taskPollingTimer = null;
                }
            }, 1500);
        }

        function updateTaskCounter() {
            const pending = activeTasks.filter(t => t.status === 'pending').length;
            const queued = activeTasks.filter(t => t.status === 'queued').length;
            const processing = activeTasks.filter(t => t.status === 'processing').length;
            const completed = activeTasks.filter(t => t.status === 'completed').length;
            const failed = activeTasks.filter(t => t.status === 'failed').length;
            const cancelled = activeTasks.filter(t => t.status === 'cancelled').length;
            const counterEl = document.getElementById('taskCounter');
            if (counterEl) {
                const items = [];
                if (pending > 0) {
                    const pendingLabel = comfyUIAvailable ? '⏸ 等待提交' : '⏳ 等待ComfyUI';
                    items.push(`<span style="padding:2px 8px;background:#fff3e0;border-radius:3px;color:#e65100;">${pendingLabel} ${pending}</span>`);
                }
                if (queued > 0) items.push(`<span style="padding:2px 8px;background:#e3f2fd;border-radius:3px;color:#1565c0;">⏳ ${queued} 排队中</span>`);
                if (processing > 0) items.push(`<span style="padding:2px 8px;background:#e8f5e9;border-radius:3px;color:#2e7d32;">⚙️ ${processing} 处理中</span>`);
                if (completed > 0) items.push(`<span style="padding:2px 8px;background:#e0f2f1;border-radius:3px;color:#00695c;">✅ ${completed} 完成</span>`);
                if (failed > 0) items.push(`<span style="padding:2px 8px;background:#ffebee;border-radius:3px;color:#c62828;">❌ ${failed} 失败</span>`);
                if (cancelled > 0) items.push(`<span style="padding:2px 8px;background:#f5f5f5;border-radius:3px;color:#616161;">🚫 ${cancelled} 已取消</span>`);
                counterEl.innerHTML = items.length > 0 ? items.join('') : '<span style="color:#999;">暂无任务</span>';
            }
        }

                                <div style="font-size: 10px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                                <div style="font-size: 9px; color: #888;">${formatFileSize(item.size)}</div>
                            </div>
                        `;
                        card.appendChild(content);
                        card.onclick = () => openFileManagerPreview(item);
                    } else if (item.type === 'text') {
                        const content = document.createElement('div');
                        content.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; height: 60px; background: #fff8e1; font-size: 24px;">📝</div>
                            <div style="padding: 4px 6px;">
                                <div style="font-size: 10px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                                <div style="font-size: 9px; color: #888;">${formatFileSize(item.size)}</div>
                            </div>
                        `;
                        card.appendChild(content);
                        card.onclick = () => openFileManagerPreview(item);
                    } else {
                        const content = document.createElement('div');
                        content.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; height: 60px; background: #f8f9fa; font-size: 24px;">📄</div>
                            <div style="padding: 4px 6px; font-size: 10px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(item.name)}</div>
                        `;
                        card.appendChild(content);
                        card.onclick = () => openFileManagerPreview(item);
                    }

                    grid.appendChild(card);
                });

                // 更新偏移量
                historyOffset += data.items.length;

                // 加载更多按钮
                const loadMoreBtn = document.getElementById('historyLoadMore');
                if (historyOffset + HISTORY_PAGE_SIZE < data.total) {
                    loadMoreBtn.style.display = 'block';
                    loadMoreBtn.textContent = `加载更多... (${historyOffset + data.items.length}/${data.total})`;
                } else {
                    loadMoreBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('加载历史记录失败:', error);
            }
        }

        function navigateHistoryUp() {
            if (historyPath) {
                const parts = historyPath.split('/');
                parts.pop();
                historyPath = parts.join('/');
                historyOffset = 0;
                loadHistory();
            }
        }

        // ========== 文件管理预览 + 添加到槽位 ==========

        let currentFmItem = null;  // 当前文件管理预览的文件

        function openFileManagerPreview(item) {
            currentFmItem = item;
            const modal = document.getElementById('fmPreviewModal');
            const body = document.getElementById('fmPreviewBody');
            const title = document.getElementById('fmPreviewTitle');
            title.textContent = item.name;

            let previewHtml = '';
            let actionHtml = '';

            if (item.type === 'image') {
                const imgUrl = `/api/history/image/${encodeURIComponent(item.path)}`;
                previewHtml = `<img src="${imgUrl}" style="max-width:100%; max-height:50vh; display:block; margin:0 auto; border-radius:6px;">`;
                actionHtml = `
                    <button type="button" style="flex:1; padding:10px; border:1px solid #667eea; background:white; color:#667eea; border-radius:6px; cursor:pointer; font-size:13px;">🖼️ 添加到图片参考槽位</button>
                `;
            } else if (item.type === 'audio') {
                const audioUrl = `/api/history/audio/${encodeURIComponent(item.path)}`;
                previewHtml = `<audio controls autoplay style="width:100%;"><source src="${audioUrl}">您的浏览器不支持音频播放</audio>`;
                actionHtml = `
                    <button type="button" style="flex:1; padding:10px; border:1px solid #667eea; background:white; color:#667eea; border-radius:6px; cursor:pointer; font-size:13px;">🎵 添加到音频参考槽位</button>
                `;
            } else if (item.type === 'video') {
                const videoUrl = `/api/history/video/${encodeURIComponent(item.path)}`;
                previewHtml = `<video controls autoplay style="max-width:100%; max-height:50vh; display:block; margin:0 auto;"><source src="${videoUrl}">您的浏览器不支持视频播放</video>`;
                actionHtml = `
                    <button type="button" style="flex:1; padding:10px; border:1px solid #667eea; background:white; color:#667eea; border-radius:6px; cursor:pointer; font-size:13px;">🎬 添加到视频参考槽位</button>
                `;
            } else if (item.type === 'text') {
                const textUrl = `/api/history/text/${encodeURIComponent(item.path)}`;
                previewHtml = `<div id="fmTextPreview" style="max-height:50vh; overflow-y:auto; background:#f8f9fa; border:1px solid #ddd; border-radius:6px; padding:12px; font-family:monospace; font-size:12px; white-space:pre-wrap; word-break:break-all;">加载中...</div>`;
                actionHtml = `
                    <button type="button" style="flex:1; padding:10px; border:1px solid #4CAF50; background:white; color:#4CAF50; border-radius:6px; cursor:pointer; font-size:13px;">📝 添加到提示词</button>
                `;
                // 异步加载文本内容
                fetch(textUrl).then(r => r.ok ? r.text() : Promise.reject()).then(text => {
                    const el = document.getElementById('fmTextPreview');
                    if (el) el.textContent = text;
                }).catch(() => {
                    const el = document.getElementById('fmTextPreview');
                    if (el) el.textContent = '加载失败';
                });
            } else {
                previewHtml = `<div style="text-align:center; padding:40px; color:#888;">📄 该文件类型暂不支持预览</div>`;
            }

            body.innerHTML = `
                <div style="margin-bottom:15px;">
                    ${previewHtml}
                </div>
                <div id="fmActionRow" style="display:flex; gap:10px; align-items:center; padding:10px; background:#f8f9fa; border-radius:8px;">
                    ${actionHtml}
                    <button type="button" id="fmDeleteBtn" style="flex:0 0 auto; padding:10px 14px; border:1px solid #f44336; background:white; color:#f44336; border-radius:6px; cursor:pointer; font-size:13px;">🗑️ 删除</button>
                </div>
                <div style="font-size:11px; color:#888; margin-top:8px; text-align:center;">
                    ${escapeHtml(item.name)} · ${item.is_dir ? '目录' : formatFileSize(item.size)}
                </div>
            `;
            // 用闭包绑定操作按钮，直接捕获 item，避免依赖全局变量
            const actionRow = document.getElementById('fmActionRow');
            const actionBtns = actionRow.querySelectorAll('button');
            // 最后一个按钮是删除
            actionBtns[actionBtns.length - 1].onclick = () => confirmDeleteFmItem();
            // 前面的按钮是添加操作（根据类型）
            if (item.type === 'image') {
                actionBtns[0].onclick = () => openSlotPicker('image', item);
            } else if (item.type === 'audio') {
                actionBtns[0].onclick = () => openSlotPicker('audio', item);
            } else if (item.type === 'video') {
                actionBtns[0].onclick = () => openSlotPicker('video', item);
            } else if (item.type === 'text') {
                actionBtns[0].onclick = () => addTextToPrompt(item);
            }
            modal.classList.add('show');
        }

        function closeFmPreview() {
            document.getElementById('fmPreviewModal').classList.remove('show');
            // 停止音视频播放
            document.querySelectorAll('#fmPreviewBody audio, #fmPreviewBody video').forEach(el => { el.pause(); el.src = ''; });
            currentFmItem = null;
        }

        async function confirmDeleteFmItem() {
            if (!currentFmItem) return;
            if (!confirm(`确定要删除 "${currentFmItem.name}" 吗？此操作不可恢复！`)) return;
            try {
                const response = await fetch(`/api/history/file?path=${encodeURIComponent(currentFmItem.path)}`, { method: 'DELETE' });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || '删除失败');
                }
                showStatus(`🗑️ 已删除: ${currentFmItem.name}`, 'success');
                closeFmPreview();
                loadHistory();
            } catch (error) {
                showStatus(`❌ 删除失败: ${error.message}`, 'error');
            }
        }

        // 槽位选择弹窗
        let slotPickerType = null;   // 'image' | 'audio' | 'video'
        let slotPickerItem = null;   // 当前要添加的文件项

        function openSlotPicker(type, item) {
            if (item) currentFmItem = item;
            slotPickerType = type;
            slotPickerItem = currentFmItem;
            const modal = document.getElementById('slotPickerModal');
            const title = document.getElementById('slotPickerTitle');
            const grid = document.getElementById('slotPickerGrid');

            let maxSlots, slots, slotLabel;
            if (type === 'image') {
                maxSlots = 9; slots = uploadedImages; slotLabel = 'Picture';
                title.textContent = `选择图片参考槽位（共 ${maxSlots} 个）`;
            } else if (type === 'audio') {
                maxSlots = 3; slots = uploadedAudio; slotLabel = 'Audio';
                title.textContent = `选择音频参考槽位（共 ${maxSlots} 个）`;
            } else if (type === 'video') {
                maxSlots = 3; slots = uploadedVideo; slotLabel = 'Video';
                title.textContent = `选择视频参考槽位（共 ${maxSlots} 个）`;
            }

            grid.innerHTML = '';
            for (let i = 0; i < maxSlots; i++) {
                const slot = slots[i];
                const btn = document.createElement('div');
                btn.style.cssText = 'position:relative; aspect-ratio:1; border-radius:8px; border:2px solid ' + (slot ? '#667eea' : '#ccc') + '; background:' + (slot ? '#f0f3ff' : '#f9f9f9') + '; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:all 0.2s; overflow:hidden;';
                const icon = type === 'image' ? '🖼️' : type === 'audio' ? '🎵' : '🎬';
                const status = slot ? `<div style="font-size:9px; color:#667eea; margin-top:2px;">已占用</div>` : `<div style="font-size:9px; color:#888; margin-top:2px;">空槽位</div>`;
                btn.innerHTML = `
                    <div style="font-size:20px;">${icon}</div>
                    <div style="font-size:10px; color:#333; font-weight:500;">&lt;${slotLabel} ${i + 1}&gt;</div>
                    ${status}
                `;
                btn.onmouseenter = () => { btn.style.borderColor = '#667eea'; btn.style.background = '#e8edff'; };
                btn.onmouseleave = () => { btn.style.borderColor = slot ? '#667eea' : '#ccc'; btn.style.background = slot ? '#f0f3ff' : '#f9f9f9'; };
                btn.onclick = () => {
                    const slotName = `<${slotLabel} ${i + 1}>`;
                    const msg = slot ? `槽位 ${slotName} 已被占用，是否覆盖？` : `确认将文件添加到槽位 ${slotName}？`;
                    if (!confirm(msg)) return;
                    addFileToSlot(type, i);
                };
                grid.appendChild(btn);
            }
            modal.classList.add('show');
        }

        function closeSlotPicker() {
            document.getElementById('slotPickerModal').classList.remove('show');
            slotPickerType = null;
            slotPickerItem = null;
        }

        async function addFileToSlot(type, slotIndex) {
            const item = slotPickerItem || currentFmItem;
            if (!item) { showStatus('❌ 未选中文件', 'error'); return; }
            try {
                showStatus('⏳ 正在加载文件数据...', 'info');
                const resp = await fetch(`/api/history/file-base64/${encodeURIComponent(item.path)}`);
                if (!resp.ok) throw new Error('加载文件失败');
                const data = await resp.json();

                if (type === 'image') {
                    uploadedImages[slotIndex] = {
                        type: 'server',
                        filename: data.filename,
                        path: item.path,
                        preview: `/api/history/image/${encodeURIComponent(item.path)}`,
                        base64: data.base64
                    };
                    updateImageList();
                } else if (type === 'audio') {
                    uploadedAudio[slotIndex] = {
                        type: 'server',
                        filename: data.filename,
                        path: item.path,
                        base64: data.base64,
                        mime_type: data.mime_type
                    };
                    updateAudioPreview();
                } else if (type === 'video') {
                    uploadedVideo[slotIndex] = {
                        type: 'server',
                        filename: data.filename,
                        path: item.path,
                        base64: data.base64
                    };
                    updateVideoPreview();
                }
                saveConfigToStorage();
                const slotLabel = type === 'image' ? 'Picture' : type === 'audio' ? 'Audio' : 'Video';
                showStatus(`✅ 已添加到 <${slotLabel} ${slotIndex + 1}>: ${data.filename}`, 'success');
                closeSlotPicker();
                closeFmPreview();
            } catch (error) {
                showStatus(`❌ 添加失败: ${error.message}`, 'error');
            }
        }

        async function addTextToPrompt(item) {
            const target = item || currentFmItem;
            if (!target) { showStatus('❌ 未选中文件', 'error'); return; }
            if (!confirm(`确认将 "${target.name}" 的内容添加到提示词框？\n\n（将追加到当前提示词末尾）`)) return;
            try {
                const resp = await fetch(`/api/history/text/${encodeURIComponent(target.path)}`);
                if (!resp.ok) throw new Error('加载文本失败');
                const text = await resp.text();
                const promptEl = document.getElementById('promptInput');
                const current = promptEl.value.trim();
                promptEl.value = current ? current + '\n\n' + text.trim() : text.trim();
                saveConfigToStorage();
                showStatus(`✅ 已将 "${target.name}" 添加到提示词`, 'success');
                closeFmPreview();
            } catch (error) {
                showStatus(`❌ 添加失败: ${error.message}`, 'error');
            }
        }

        // ========== 表单提交 ==========

        // 获取图片的 base64 数据（服务器文件需要按需获取）
        async function getImageBase64(img) {
            if (img.type === 'upload') {
                return img.base64;
            }
            // 服务器文件：如果已缓存则直接返回
            if (img.base64) {
                return img.base64;
            }
            // 否则从服务器获取
            const response = await fetch(`/api/browser/file-base64?path=${encodeURIComponent(img.path)}`);
            if (!response.ok) throw new Error(`获取图片失败: ${img.filename}`);
            const data = await response.json();
            img.base64 = data.base64;  // 缓存
            return data.base64;
        }

        async function getServerFileBase64(item) {
            if (item.type === 'upload') {
                return item.base64;
            }
            // 如果已缓存则直接返回
            if (item.base64) {
                return item.base64;
            }
            const response = await fetch(`/api/browser/file-base64?path=${encodeURIComponent(item.path)}`);
            if (!response.ok) throw new Error(`获取文件失败: ${item.filename}`);
            const data = await response.json();
            item.base64 = data.base64;  // 缓存
            return data.base64;
        }

        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // 验证（检查是否有至少一张图片）
            const validImages = uploadedImages.filter(img => img !== null);
            if (validImages.length === 0) {
                showStatus('请至少上传一张图片', 'error');
                return;
            }

            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showStatus('请输入提示词', 'error');
                return;
            }

            // 如果 ComfyUI 未就绪，友好提示但仍然允许提交（任务会等待自动提交）
            if (!comfyUIAvailable) {
                showStatus('⏳ ComfyUI (8188) 尚未启动，任务已加入等待队列 — 启动成功后会自动提交，请耐心等待', 'info');
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '⏳ 准备数据中...';

            try {
                // 获取所有图片的 base64（跳过空槽位）
                showStatus('正在准备图片数据...', 'info');
                const imageBase64List = await Promise.all(
                    uploadedImages.filter(img => img !== null).map(img => getImageBase64(img))
                );

                // 获取音频和视频的 base64（取第一个非空槽位，保持向后兼容）
                let audioBase64 = null;
                const firstAudioIdx = uploadedAudio.findIndex(a => a !== null);
                const firstAudio = firstAudioIdx >= 0 ? uploadedAudio[firstAudioIdx] : null;
                if (firstAudio) {
                    showStatus('正在准备音频数据...', 'info');
                    audioBase64 = await getServerFileBase64(firstAudio);
                }

                let videoBase64 = null;
                const firstVideo = uploadedVideo.find(v => v !== null);
                if (firstVideo) {
                    showStatus('正在准备视频数据...', 'info');
                    videoBase64 = await getServerFileBase64(firstVideo);
                }

                // 音频裁剪参数（取第一个非空槽位的裁剪设置）
                const audioTrimValues = firstAudioIdx >= 0 ? audioTrim[firstAudioIdx] : { start: 0, end: 3 };

                // 准备提交数据
                const filenamePrefix = document.getElementById('filenamePrefixInput').value.trim();
                const data = {
                    model: document.getElementById('modelSelect').value,
                    data: {
                        images: imageBase64List,
                        audio: audioBase64,
                        audio_start_time: formatTimeMMSS(audioTrimValues.start),
                        audio_end_time: formatTimeMMSS(audioTrimValues.end),
                        video: videoBase64,
                        prompt: prompt,
                        duration: parseFloat(document.getElementById('durationInput').value),
                        resolution: parseFloat(document.getElementById('resolutionInput').value),
                        aspect_ratio: document.getElementById('aspectRatioInput').value,
                        filename_prefix: filenamePrefix
                    }
                };

                // 在按钮下方显示提交状态
                showStatus('⏳ 正在提交任务到队列...', 'info');

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try {
                        const error = await response.json();
                        errMsg = error.detail || errMsg;
                    } catch {
                        errMsg = await response.text().then(t => t.substring(0, 200) || errMsg);
                    }
                    throw new Error(errMsg);
                }

                let submitResult;
                try {
                    submitResult = await response.json();
                } catch {
                    throw new Error('服务器返回了非 JSON 响应，请检查服务是否正常运行');
                }
                const taskId = submitResult.task_id;

                activeTasks.unshift({
                    id: taskId,
                    model: data.model,
                    prompt: data.data.prompt,
                    status: 'pending',
                    progress: 0,
                    createdAt: new Date().toISOString(),
                    resultShown: false,
                    errorShown: false
                });

                showStatus(`✅ 任务已提交 (ID: ${taskId.substring(0, 8)}...)，正在排队处理...`, 'success');

                // 恢复按钮状态，允许连续提交
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 生成视频';

                updateTaskList();
                updateTaskCounter();
                startTaskPolling();
                saveTasksToStorage();

            } catch (error) {
                let friendlyMsg = error.message;
                // 针对常见错误给出友好提示
                if (error.message && (error.message.includes('Failed to fetch') || error.message.includes('NetworkError') || error.message.includes('fetch'))) {
                    friendlyMsg = '无法连接到服务器，请检查网络连接是否正常';
                } else if (error.message && (error.message.includes('COMFYUI_NOT_AVAILABLE') || error.message.includes('8188') || error.message.includes('ComfyUI'))) {
                    friendlyMsg = '⏳ ComfyUI 尚未启动 (端口 8188)，任务已保存，启动后会自动提交，请耐心等待…';
                } else if (error.message && error.message.includes('timeout')) {
                    friendlyMsg = '请求超时，ComfyUI 可能正在启动中，请稍后再试';
                }
                showStatus(`❌ 提交失败: ${friendlyMsg}`, 'error');
                console.error('提交失败:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 生成视频';
            }
        });

        // ========== 任务持久化 ==========

        const TASK_STORAGE_KEY = 'webui_active_tasks';

        function saveTasksToStorage() {
            try {
                // 只保存未完成的任务
                const tasks = activeTasks.filter(t =>
                    t.status !== 'completed' || !t.resultShown  // 已完成且已显示的可以清理
                );
                localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                // localStorage 满了就忽略
            }
        }

        async function restoreTasksFromServer() {
            try {
                const response = await fetch('/api/tasks?limit=50');
                if (!response.ok) return;
                const data = await response.json();

                if (!data.tasks || data.tasks.length === 0) return;

                // 恢复所有 pending/queued/processing 的任务
                activeTasks = data.tasks
                    .filter(t => t.status === 'pending' || t.status === 'queued' || t.status === 'processing')
                    .map(t => ({
                        id: t.task_id,
                        model: t.model,
                        prompt: t.prompt || '',
                        status: t.status,
                        progress: t.progress || 0,
                        createdAt: t.created_at,
                        resultShown: false,
                        errorShown: false,
                        error: t.error || null,
                        comfyui_progress: t.comfyui_progress || null
                    }));

                if (activeTasks.length > 0) {
                    console.log(`✅ 恢复了 ${activeTasks.length} 个活跃任务`);
                    updateTaskList();
                    updateTaskCounter();
                    startTaskPolling();
                }
            } catch (error) {
                console.error('恢复任务失败:', error);
            }
        }

        // ========== 初始化 ==========

        // ========== ComfyUI 健康检查 ==========

        let comfyUIHealthTimer = null;
        let comfyUIAvailable = true; // 默认假设可用

        async function checkComfyUIHealth() {
            try {
                const resp = await fetch('/api/comfyui-health');
                const data = await resp.json();
                const banner = document.getElementById('comfyuiHealthBanner');
                const icon = document.getElementById('healthIcon');
                const msg = document.getElementById('healthMessage');

                if (data.available) {
                    comfyUIAvailable = true;
                    banner.style.display = 'none';
                    // 停止轮询
                    if (comfyUIHealthTimer) {
                        clearInterval(comfyUIHealthTimer);
                        comfyUIHealthTimer = null;
                    }
                } else {
                    comfyUIAvailable = false;
                    banner.style.display = 'flex';
                    banner.style.background = '#fff3cd';
                    banner.style.border = '1px solid #ffc107';
                    banner.style.color = '#856404';
                    icon.textContent = '⏳';
                    msg.textContent = data.message || 'ComfyUI 正在启动中，任务将自动提交...';

                    // 每 5 秒重新检查
                    if (!comfyUIHealthTimer) {
                        comfyUIHealthTimer = setInterval(checkComfyUIHealth, 5000);
                    }
                }
            } catch (e) {
                // 检查失败时也显示提示
                const banner = document.getElementById('comfyuiHealthBanner');
                const icon = document.getElementById('healthIcon');
                const msg = document.getElementById('healthMessage');
                comfyUIAvailable = false;
                banner.style.display = 'flex';
                banner.style.background = '#f8d7da';
                banner.style.border = '1px solid #f5c6cb';
                banner.style.color = '#721c24';
                icon.textContent = '❌';
                msg.textContent = '无法检查 ComfyUI 状态，请确认服务已启动';
                if (!comfyUIHealthTimer) {
                    comfyUIHealthTimer = setInterval(checkComfyUIHealth, 5000);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            checkComfyUIHealth();  // 检查 ComfyUI 是否可用
            await loadModels();
            // 先恢复用户配置（决定是否跳过预置自动填充）
            loadConfigFromStorage();
            await loadPromptTemplates();
            await loadImagePresets();
            await loadAudioPresets();
            await loadVideoPresets();
            setupFileUploads();
            updateResolutionLabel(document.getElementById('resolutionInput').value);
            setupAutoSave();
            loadVersionInfo();
            loadHistory();
            loadOutputPath();
            loadPresets();
            await restoreTasksFromServer();
            // 浏览器面板默认收起，按需加载
        });
    </script>

    <!-- 预览弹窗 -->
    <div class="preview-modal" id="previewModal" onclick="if(event.target===this) closePreviewModal()">
        <div class="preview-modal-content">
            <button class="preview-modal-close" onclick="closePreviewModal()">&times;</button>
            <div id="previewModalBody"></div>
            <div class="preview-modal-title" id="previewModalTitle"></div>
        </div>
    </div>

    <!-- 文件管理预览弹窗 -->
    <div class="preview-modal" id="fmPreviewModal" onclick="if(event.target===this) closeFmPreview()" style="z-index:10001;">
        <div class="preview-modal-content" style="max-width:700px; max-height:90vh; overflow-y:auto;">
            <button class="preview-modal-close" onclick="closeFmPreview()">&times;</button>
            <div id="fmPreviewBody" style="padding:20px;"></div>
            <div class="preview-modal-title" id="fmPreviewTitle"></div>
        </div>
    </div>

    <!-- 槽位选择弹窗 -->
    <div class="preview-modal" id="slotPickerModal" onclick="if(event.target===this) closeSlotPicker()" style="z-index:10002;">
        <div class="preview-modal-content" style="max-width:500px;">
            <button class="preview-modal-close" onclick="closeSlotPicker()">&times;</button>
            <div style="padding:20px;">
                <div id="slotPickerTitle" style="font-size:15px; font-weight:600; color:#333; margin-bottom:15px;"></div>
                <div id="slotPickerGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px;"></div>
            </div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div class="qr-modal" id="qrModal" onclick="if(event.target===this) closeQRModal()">
        <div class="qr-modal-content">
            <button class="qr-modal-close" onclick="closeQRModal()">&times;</button>
            <img src="/static/wechat_qr.jpeg" alt="微信二维码">
            <div class="qr-modal-title">微信：H_haimi（海米）</div>
            <div class="qr-modal-subtitle">扫码添加微信，获取技术支持</div>
        </div>
    </div>

    <script>
        function showQRModal() {
            document.getElementById('qrModal').classList.add('show');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('show');
        }
    </script>
</body>
</html>
