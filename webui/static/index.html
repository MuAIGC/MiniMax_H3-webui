<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MiniMax-H3视频生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 13px;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s;
        }

        .contact-info:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        .contact-info img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .contact-text {
            color: white;
            font-size: 12px;
            line-height: 1.5;
        }

        .contact-text strong {
            font-size: 13px;
            display: block;
            margin-bottom: 2px;
        }

        /* QR Code Modal */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .qr-modal.show {
            display: flex;
        }

        .qr-modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            position: relative;
        }

        .qr-modal-content img {
            width: 300px;
            height: 300px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .qr-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f44336;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-modal-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .qr-modal-subtitle {
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .contact-info {
                width: 100%;
                justify-content: center;
            }

            .contact-info img {
                width: 60px;
                height: 60px;
            }

            .qr-modal-content img {
                width: 250px;
                height: 250px;
            }
        }

        .version-badge {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-label {
            display: block;
            padding: 40px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .file-upload-label:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-upload-label.has-files {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .file-upload-label svg {
            width: 48px;
            height: 48px;
            fill: #999;
            margin-bottom: 10px;
        }

        .file-upload-label.has-files svg {
            fill: #4caf50;
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .file-list {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-item-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .file-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        .file-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
        }

        .file-item .remove-btn:hover {
            background: #f44336;
        }

        .file-item-label {
            font-size: 11px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #667eea;
            background: #f0f0ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            white-space: nowrap;
        }

        .resource-label {
            display: inline-block;
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #667eea;
            background: #f0f0ff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 8px;
        }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #90caf9;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #81c784;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result video {
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .footer-version {
            font-size: 12px;
            color: #999;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .footer-version .version-tag {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 10px;
            color: #667eea;
            font-weight: 600;
            cursor: help;
        }

        .footer-version .version-tag:hover {
            background: #e0e0ff;
        }

        /* 标签按钮样式 */
        .tab-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            margin-right: 8px;
        }

        .tab-btn:hover {
            border-color: #667eea;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-panel {
            margin-top: 10px;
        }

        /* 浏览器工具栏 */
        .browser-toolbar {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .browser-toolbar button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .browser-toolbar button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .browser-toolbar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .browser-toolbar .path-display {
            color: #666;
            font-size: 12px;
            font-family: monospace;
        }

        .load-more-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
        }

        .load-more-btn:hover {
            background: #e0e0e0;
        }

        /* 图片网格 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .image-item {
            position: relative;
            aspect-ratio: 1;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-item:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-item .folder-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 48px;
            background: #f0f0f0;
        }

        .image-item .item-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-item.selected {
            border-color: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .image-item.selected::after {
            content: '\2713';
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 音频列表 */
        .audio-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .audio-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .audio-item:hover {
            background: #f5f5f5;
        }

        .audio-item:last-child {
            border-bottom: none;
        }

        .audio-item .audio-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .audio-item .audio-info {
            flex: 1;
        }

        .audio-item .audio-name {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .audio-item .audio-size {
            font-size: 11px;
            color: #999;
        }

        .audio-item.selected {
            background: #e3f2fd;
        }

        /* 视频列表 */
        .video-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .video-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
            gap: 10px;
        }

        .video-item:hover {
            background: #f5f5f5;
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-thumb {
            width: 80px;
            height: 45px;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
            position: relative;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumb .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .video-item .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-item .video-name {
            font-weight: 500;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-item .video-size {
            font-size: 11px;
            color: #999;
        }

        .video-item.selected {
            background: #e3f2fd;
        }

        /* 任务列表 */
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            gap: 12px;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .task-status-badge.pending {
            background: #fff3e0;
            color: #e65100;
        }

        .task-status-badge.processing {
            background: #e3f2fd;
            color: #1565c0;
        }

        .task-status-badge.completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .task-status-badge.failed {
            background: #ffebee;
            color: #c62828;
        }

        .task-status-badge.cancelled {
            background: #f5f5f5;
            color: #757575;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-model {
            font-weight: 600;
            font-size: 13px;
            color: #333;
        }

        .task-prompt {
            font-size: 12px;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-time {
            font-size: 11px;
            color: #999;
        }

        /* 图片预览模态框 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 100%;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ccc;
        }

        /* 预置提示词按钮样式 */
        .preset-btn {
            padding: 6px 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .params-grid {
                grid-template-columns: 1fr;
            }

            .file-item {
                width: 80px;
                height: 80px;
            }
        }

        /* 预览弹窗 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-modal.show {
            display: flex;
        }

        .preview-modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .preview-modal-content img {
            max-width: 100%;
            max-height: 85vh;
            display: block;
        }

        .preview-modal-content audio,
        .preview-modal-content video {
            max-width: 100%;
            display: block;
        }

        .preview-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }

        .preview-modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .preview-modal-title {
            padding: 10px 15px;
            background: #f5f5f5;
            font-size: 14px;
            color: #333;
            border-top: 1px solid #e0e0e0;
        }

        .preview-thumb.clickable {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .preview-thumb.clickable:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🎬 MiniMax-H3视频生成</h1>
                <p>上传图片、音频和提示词，生成 AI 数字人视频</p>
            </div>
            <div class="contact-info" onclick="showQRModal()">
                <img src="/static/wechat_qr.jpeg" alt="微信二维码">
                <div class="contact-text">
                    <strong>微信：H_haimi（海米）</strong>
                    扫码添加微信，获取技术支持
                </div>
            </div>
        </div>

        <!-- ComfyUI 健康状态横幅 -->
        <div id="comfyuiHealthBanner" style="display:none; padding:12px 16px; margin-bottom:16px; border-radius:8px; font-size:14px; align-items:center; gap:10px;">
            <span id="healthIcon" style="font-size:20px;"></span>
            <span id="healthMessage" style="flex:1;"></span>
            <button onclick="checkComfyUIHealth()" style="padding:4px 12px; border:1px solid rgba(0,0,0,0.2); background:rgba(255,255,255,0.5); border-radius:4px; cursor:pointer; font-size:12px;">刷新</button>
        </div>

        <div class="content">
            <form id="generateForm">
                <!-- 工作流选择 -->
                <div class="form-group">
                    <div style="display:flex; align-items:center; gap:10px;">

                        <span class="path-display" id="historyCurrentPath">/</span>
                        <button type="button" onclick="loadHistory()" style="margin-left: auto;">🔄 刷新</button>
                    </div>
                    <div id="historyGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; max-height: 600px; overflow-y: auto; padding: 8px; border: 1px solid #e0e0e0; border-radius: 8px;"></div>

    <script>
        // ========== 全局状态 ==========
        let uploadedImages = new Array(9).fill(null);   // 固定9个槽位，每个槽位: null | { type: 'upload', filename, base64, preview } | { type: 'server', filename, path }
        const MAX_IMAGE_SLOTS = 9;
        let uploadedAudio = new Array(3).fill(null);   // 固定3个槽位
        const MAX_AUDIO_SLOTS = 3;

        // 当前正在选择的槽位（点击空槽位时设置）
        let activeImageSlot = -1;   // -1 表示没有激活
        let activeAudioSlot = -1;
        let activeVideoSlot = -1;

        // 音频裁剪参数（每个槽位独立），单位：秒
        let audioTrim = [
            { start: 0, end: 3 },
            { start: 0, end: 3 },
            { start: 0, end: 3 }
        ];

        // 秒数 → M:SS 格式
        function formatTimeMMSS(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        // M:SS 格式 → 秒数
        function parseTimeMMSS(str) {
            const parts = str.split(':');
            if (parts.length === 2) {
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            return parseFloat(str) || 0;
        }
        let uploadedVideo = new Array(3).fill(null);   // 固定3个槽位
        const MAX_VIDEO_SLOTS = 3;

        let imageBrowserPath = '';
        let audioBrowserPath = '';
        let videoBrowserPath = '';
        let imageBrowserOffset = 0;
        let audioBrowserOffset = 0;
        let videoBrowserOffset = 0;
        const PAGE_SIZE = 100;

        let activeTasks = [];
        let taskPollingTimer = null;

        // ========== 图片浏览器 ==========

        async function loadImageBrowser(append) {
            try {
                const response = await fetch(`/api/browser/list?path=${encodeURIComponent(imageBrowserPath)}&offset=${imageBrowserOffset}&limit=${PAGE_SIZE}`);
                const data = await response.json();

                const grid = document.getElementById('imageGrid');
                if (!append) grid.innerHTML = '';

                document.getElementById('currentPath').textContent = '/' + imageBrowserPath;
                document.getElementById('upBtn').disabled = imageBrowserPath === '';

                data.items.forEach(item => {
                    // 图片浏览器只显示目录和图片
                    if (!item.is_dir && item.type !== 'image') return;

                    const div = document.createElement('div');
                    div.className = 'image-item';

                    if (item.is_dir) {
                        div.innerHTML = `<div class="folder-icon">📁</div><div class="item-name">${escapeHtml(item.name)}</div>`;
                        div.onclick = () => {
                            imageBrowserPath = item.path;
                            imageBrowserOffset = 0;
                            loadImageBrowser();
                        };
                    } else if (item.type === 'image') {
                        // 使用缩略图接口，避免加载原图
                        const thumbUrl = `/api/browser/image-thumbnail/${encodeURIComponent(item.path)}?size=200`;
                        div.innerHTML = `<img src="${thumbUrl}" alt="${escapeHtml(item.name)}" loading="lazy"><div class="item-name">${escapeHtml(item.name)}</div>`;
                        div.onclick = () => {
                            // 检查是否已选（同一个 slot 不算重复）
                            const slotIdx = activeImageSlot >= 0 ? activeImageSlot : uploadedImages.findIndex(img => img === null);
                            if (slotIdx === -1 || uploadedImages[slotIdx] !== null && uploadedImages[slotIdx].type === 'server' && uploadedImages[slotIdx].path === item.path) {
                                // 已在该槽位选中相同文件，忽略
                                if (slotIdx === -1) {
                                    alert('所有9个图片槽位都已使用');
                                }
                                return;
                            }
                            let targetSlot = activeImageSlot >= 0 ? activeImageSlot : uploadedImages.findIndex(img => img === null);
                            if (targetSlot === -1 || uploadedImages[targetSlot] !== null) {
                                targetSlot = uploadedImages.findIndex(img => img === null);
                            }
                            if (targetSlot === -1) {
                                alert('所有9个图片槽位都已使用');
                                return;
                            }
                            uploadedImages[targetSlot] = {
                                type: 'server',
                                filename: item.name,
                                path: item.path,
                                preview: thumbUrl,
                                base64: null  // 将在后台缓存
                            };
                            const filledSlot = targetSlot;
                            // 立即获取并缓存 base64，避免提交时等待
                            fetch(`/api/browser/file-base64?path=${encodeURIComponent(item.path)}`)
                                .then(r => r.ok ? r.json() : Promise.reject())
                                .then(data => {
                                    if (uploadedImages[filledSlot] && uploadedImages[filledSlot].path === item.path) {
                                        uploadedImages[filledSlot].base64 = data.base64;
                                    }
                                })
                                .catch(() => {});  // 失败时提交时再重试
                            div.classList.add('selected');
                            updateImageList();
                            showStatus(`✅ 已选择图片到 <Picture ${filledSlot + 1}>: ${item.name}`, 'success');
                            saveConfigToStorage();
                            closeImageSlotPicker();
                        };
                    }

                    grid.appendChild(div);
                });

                // 加载更多按钮
                if (!append) {
                    const existing = grid.querySelector('.load-more-btn');
                    if (existing) existing.remove();
                }
                if (imageBrowserOffset + PAGE_SIZE < data.total) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'load-more-btn';
                    btn.textContent = `加载更多... (${imageBrowserOffset + data.items.length}/${data.total})`;
                    btn.onclick = () => {
                        imageBrowserOffset += PAGE_SIZE;
                        loadImageBrowser(true);
                    };
                    grid.appendChild(btn);
                }

            } catch (error) {
                console.error('加载图片浏览器失败:', error);
                showStatus('加载图片浏览器失败', 'error');
            }
        }

        function navigateUp() {
            if (imageBrowserPath) {
                const parts = imageBrowserPath.split('/');
                parts.pop();
                imageBrowserPath = parts.join('/');
                imageBrowserOffset = 0;
                loadImageBrowser();
            }
        }

        // ========== 音频浏览器 ==========

        async function loadAudioBrowser(append) {
            try {
                const response = await fetch(`/api/browser/list?path=${encodeURIComponent(audioBrowserPath)}&offset=${audioBrowserOffset}&limit=${PAGE_SIZE}`);
                const data = await response.json();

                const list = document.getElementById('audioBrowserList');
                if (!append) list.innerHTML = '';

                document.getElementById('audioCurrentPath').textContent = '/' + audioBrowserPath;
                document.getElementById('audioUpBtn').disabled = audioBrowserPath === '';

                data.items.forEach(item => {
                    // 音频浏览器只显示目录和音频
                    if (!item.is_dir && item.type !== 'audio') return;

                    const div = document.createElement('div');
                    div.className = 'audio-item';

                    if (item.is_dir) {
                        div.innerHTML = `
                            <div class="audio-icon">📁</div>
                            <div class="audio-info">
                                <div class="audio-name">${escapeHtml(item.name)}</div>
                                <div class="audio-size">目录</div>
                            </div>`;
                        div.onclick = () => {
                            audioBrowserPath = item.path;
                            audioBrowserOffset = 0;
                            loadAudioBrowser();
                        };
                    } else if (item.type === 'audio') {
                        div.innerHTML = `
                            <div class="audio-icon">🎵</div>
                            <div class="audio-info">
                                <div class="audio-name">${escapeHtml(item.name)}</div>
                                <div class="audio-size">${formatFileSize(item.size)}</div>
                            </div>`;
                        div.onclick = () => {
                            // 取消之前选中的
                            list.querySelectorAll('.audio-item.selected').forEach(el => el.classList.remove('selected'));
                            div.classList.add('selected');

                            let targetSlot = activeAudioSlot >= 0 ? activeAudioSlot : uploadedAudio.findIndex(a => a === null);
                            if (targetSlot === -1 || uploadedAudio[targetSlot] !== null) {
                                targetSlot = uploadedAudio.findIndex(a => a === null);
                            }
                            if (targetSlot === -1) {
                                alert('所有3个音频槽位都已使用');
                                return;
                            }

                            uploadedAudio[targetSlot] = {
                                type: 'server',
                                filename: item.name,
                                path: item.path,
                                base64: null
                            };
                            const filledSlot = targetSlot;
                            // 立即缓存 base64
                            fetch(`/api/browser/file-base64?path=${encodeURIComponent(item.path)}`)
                                .then(r => r.ok ? r.json() : Promise.reject())
                                .then(data => {
                                    if (uploadedAudio[filledSlot] && uploadedAudio[filledSlot].path === item.path) {
                                        uploadedAudio[filledSlot].base64 = data.base64;
                                    }
                                })
                                .catch(() => {});

                            updateAudioPreview();

                            showStatus(`✅ 已选择音频到 <Audio ${filledSlot + 1}>: ${item.name}`, 'success');
                            saveConfigToStorage();
                            closeAudioSlotPicker();
                        };
                    }

                    list.appendChild(div);
                });

                if (!append) {
                    const existing = list.querySelector('.load-more-btn');
                    if (existing) existing.remove();
                }
                if (audioBrowserOffset + PAGE_SIZE < data.total) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'load-more-btn';
                    btn.textContent = `加载更多... (${audioBrowserOffset + data.items.length}/${data.total})`;
                    btn.onclick = () => {
                        audioBrowserOffset += PAGE_SIZE;
                        loadAudioBrowser(true);
                    };
                    list.appendChild(btn);
                }

            } catch (error) {
                console.error('加载音频浏览器失败:', error);
                showStatus('加载音频浏览器失败', 'error');
            }
        }

        function navigateAudioUp() {
            if (audioBrowserPath) {
                const parts = audioBrowserPath.split('/');
                parts.pop();
                audioBrowserPath = parts.join('/');
                audioBrowserOffset = 0;
                loadAudioBrowser();
            }
        }

        // ========== 视频浏览器 ==========

        async function loadVideoBrowser(append) {
            try {
                const response = await fetch(`/api/browser/list?path=${encodeURIComponent(videoBrowserPath)}&offset=${videoBrowserOffset}&limit=${PAGE_SIZE}`);
                const data = await response.json();

                const list = document.getElementById('videoBrowserList');
                if (!append) list.innerHTML = '';

                document.getElementById('videoCurrentPath').textContent = '/' + videoBrowserPath;
                document.getElementById('videoUpBtn').disabled = videoBrowserPath === '';

                data.items.forEach(item => {
                    // 视频浏览器只显示目录和视频
                    if (!item.is_dir && item.type !== 'video') return;

                    const div = document.createElement('div');
                    div.className = 'video-item';

                    if (item.is_dir) {
                        div.innerHTML = `
                            <div class="video-thumb" style="background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 24px;">📁</div>
                            <div class="video-info">
                                <div class="video-name">${escapeHtml(item.name)}</div>
                                <div class="video-size">目录</div>
                            </div>`;
                        div.onclick = () => {
                            videoBrowserPath = item.path;
                            videoBrowserOffset = 0;
                            loadVideoBrowser();
                        };
                    } else if (item.type === 'video') {
                        const thumbUrl = `/api/browser/video-thumbnail/${encodeURIComponent(item.path)}`;
                        div.innerHTML = `
                            <div class="video-thumb">
                                <img src="${thumbUrl}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'play-overlay\\'>🎬</div>'">
                                <div class="play-overlay">▶</div>
                            </div>
                            <div class="video-info">
                                <div class="video-name">${escapeHtml(item.name)}</div>
                                <div class="video-size">${formatFileSize(item.size)}</div>
                            </div>`;
                        div.onclick = () => {
                            list.querySelectorAll('.video-item.selected').forEach(el => el.classList.remove('selected'));
                            div.classList.add('selected');

                            let targetSlot = activeVideoSlot >= 0 ? activeVideoSlot : uploadedVideo.findIndex(v => v === null);
                            if (targetSlot === -1 || uploadedVideo[targetSlot] !== null) {
                                targetSlot = uploadedVideo.findIndex(v => v === null);
                            }
                            if (targetSlot === -1) {
                                alert('所有3个视频槽位都已使用');
                                return;
                            }

                            uploadedVideo[targetSlot] = {
                                type: 'server',
                                filename: item.name,
                                path: item.path,
                                base64: null
                            };
                            const filledSlot = targetSlot;
                            // 立即缓存 base64
                            fetch(`/api/browser/file-base64?path=${encodeURIComponent(item.path)}`)
                                .then(r => r.ok ? r.json() : Promise.reject())
                                .then(data => {
                                    if (uploadedVideo[filledSlot] && uploadedVideo[filledSlot].path === item.path) {
                                        uploadedVideo[filledSlot].base64 = data.base64;
                                    }
                                })
                                .catch(() => {});

                            const infoDiv = document.getElementById('selectedVideoInfo');
                            infoDiv.style.display = 'block';
                            document.getElementById('videoResourceLabel').textContent = `<Video ${filledSlot + 1}>`;
                            document.getElementById('selectedVideoName').textContent = `已选择: ${item.name}`;
                            document.getElementById('videoPreview').src = `/api/browser/file?path=${encodeURIComponent(item.path)}`;
                            updateVideoPreview();

                            showStatus(`✅ 已选择视频到 <Video ${filledSlot + 1}>: ${item.name}`, 'success');
                            saveConfigToStorage();
                            closeVideoSlotPicker();
                        };
                    }

                    list.appendChild(div);
                });

                if (!append) {
                    const existing = list.querySelector('.load-more-btn');
                    if (existing) existing.remove();
                }
                if (videoBrowserOffset + PAGE_SIZE < data.total) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'load-more-btn';
                    btn.textContent = `加载更多... (${videoBrowserOffset + data.items.length}/${data.total})`;
                    btn.onclick = () => {
                        videoBrowserOffset += PAGE_SIZE;
                        loadVideoBrowser(true);
                    };
                    list.appendChild(btn);
                }

            } catch (error) {
                console.error('加载视频浏览器失败:', error);
                showStatus('加载视频浏览器失败', 'error');
            }
        }

        function navigateVideoUp() {
            if (videoBrowserPath) {
                const parts = videoBrowserPath.split('/');
                parts.pop();
                videoBrowserPath = parts.join('/');
                videoBrowserOffset = 0;
                loadVideoBrowser();
            }
        }

        // ========== 工具函数 ==========

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function updateResolutionLabel(value) {
            const label = document.getElementById('resolutionLabel');
            const v = parseFloat(value);
            let quality;
            if (v <= 0.3) quality = '低质量，快速生成';
            else if (v <= 0.7) quality = '标准质量';
            else if (v <= 1.2) quality = '高质量';
            else quality = '超高质量，较慢';
            label.textContent = `${v.toFixed(1)} MP (${quality})`;
        }

        // ========== localStorage 配置 ==========

        const CONFIG_STORAGE_KEY = 'webui_config';

        function saveConfigToStorage() {
            try {
                // 保存路径信息 + 预置文件标识，不保存 base64（避免超出 5MB 限制）
                const config = {
                    model: document.getElementById('modelSelect').value,
                    prompt: document.getElementById('promptInput').value,
                    duration: document.getElementById('durationInput').value,
                    resolution: document.getElementById('resolutionInput').value,
                    aspectRatio: document.getElementById('aspectRatioInput').value,
                    filenamePrefix: document.getElementById('filenamePrefixInput').value,
                    // 保存服务器文件和预置文件（不含 base64），保留槽位结构
                    serverImages: uploadedImages.map(img => {
                        if (!img) return null;
                        if (img.type === 'server') return { type: 'server', filename: img.filename, path: img.path };
                        if (img.type === 'upload' && img.filename) return { type: 'preset', filename: img.filename };
                        return null;
                    }),
                    serverAudio: uploadedAudio.map(a => {
                        if (!a) return null;
                        if (a.type === 'server') return { type: 'server', filename: a.filename, path: a.path };
                        if (a.type === 'upload' && a.filename) return { type: 'preset', filename: a.filename, mime_type: a.mime_type };
                        return null;
                    }),
                    audioTrim: audioTrim,
                    serverVideo: uploadedVideo.map(v =>
                        v && v.type === 'server' ? { type: 'server', filename: v.filename, path: v.path } : null
                    )
                };
                localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(config));
            } catch (error) {
                console.warn('保存配置失败:', error);
            }
        }

        // 标记：是否存在已保存的配置（用于决定是否自动填充预置）
        let hasSavedConfig = false;

        function loadConfigFromStorage() {
            try {
                const saved = localStorage.getItem(CONFIG_STORAGE_KEY);
                if (!saved) return;
                hasSavedConfig = true;

                const config = JSON.parse(saved);

                if (config.model) document.getElementById('modelSelect').value = config.model;
                if (config.prompt) document.getElementById('promptInput').value = config.prompt;
                if (config.duration) document.getElementById('durationInput').value = config.duration;
                if (config.resolution) {
                    document.getElementById('resolutionInput').value = config.resolution;
                    updateResolutionLabel(config.resolution);
                }
                if (config.aspectRatio) document.getElementById('aspectRatioInput').value = config.aspectRatio;
                if (config.filenamePrefix) document.getElementById('filenamePrefixInput').value = config.filenamePrefix;

                // 恢复服务器文件 + 预置文件引用（保留槽位结构）
                if (config.serverImages && Array.isArray(config.serverImages)) {
                    uploadedImages = config.serverImages.map(img => {
                        if (!img) return null;
                        if (img.type === 'server' && img.path) {
                            return {
                                ...img,
                                preview: `/api/browser/image-thumbnail/${encodeURIComponent(img.path)}?size=200`
                            };
                        }
                        if (img.type === 'preset' && img.filename) {
                            // 预置图：重新获取 base64
                            const presetImg = {
                                type: 'upload',
                                filename: img.filename,
                                base64: null,
                                preview: `/static/presets/images/${img.filename}`
                            };
                            fetch(`/api/presets/image/${encodeURIComponent(img.filename)}`)
                                .then(r => r.ok ? r.json() : null)
                                .then(data => { if (data) presetImg.base64 = data.base64; })
                                .catch(() => {});
                            return presetImg;
                        }
                        return null;
                    });
                    while (uploadedImages.length < 9) uploadedImages.push(null);
                    updateImageList();
                }
                if (config.serverAudio && Array.isArray(config.serverAudio)) {
                    uploadedAudio = config.serverAudio.map(a => {
                        if (!a) return null;
                        if (a.type === 'server' && a.path) return a;
                        if (a.type === 'preset' && a.filename) {
                            const presetAudio = {
                                type: 'upload',
                                filename: a.filename,
                                base64: null,
                                mime_type: a.mime_type || 'audio/wav'
                            };
                            fetch(`/api/presets/audio/${encodeURIComponent(a.filename)}`)
                                .then(r => r.ok ? r.json() : null)
                                .then(data => { if (data) presetAudio.base64 = data.base64; })
                                .catch(() => {});
                            return presetAudio;
                        }
                        return null;
                    });
                    while (uploadedAudio.length < 3) uploadedAudio.push(null);
                    updateAudioPreview();
                }
                // 恢复音频裁剪参数
                if (config.audioTrim && Array.isArray(config.audioTrim)) {
                    for (let i = 0; i < Math.min(config.audioTrim.length, 3); i++) {
                        const t = config.audioTrim[i];
                        if (t && typeof t.start === 'number' && typeof t.end === 'number') {
                            audioTrim[i] = { start: t.start, end: t.end };
                        }
                    }
                    updateAudioPreview();
                }
                if (config.serverVideo && Array.isArray(config.serverVideo)) {
                    uploadedVideo = config.serverVideo.map(v => {
                        if (v && v.type === 'server' && v.path) return v;
                        return null;
                    });
                    while (uploadedVideo.length < 3) uploadedVideo.push(null);
                    updateVideoPreview();
                }

                console.log('✅ 已从 localStorage 恢复配置');
            } catch (error) {
                console.error('恢复配置失败:', error);
            }
        }

        function setupAutoSave() {
            const fields = ['modelSelect', 'promptInput', 'durationInput', 'resolutionInput', 'aspectRatioInput', 'filenamePrefixInput'];
            fields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                field.addEventListener('change', saveConfigToStorage);
                field.addEventListener('input', () => {
                    clearTimeout(field._saveTimeout);
                    field._saveTimeout = setTimeout(saveConfigToStorage, 500);
                });
            });
        }

        function resetUserConfig() {
            if (!confirm('确定要重置所有配置吗？\n将清空已选图片/音频/提示词/参数，恢复为初始预置素材。')) return;
            try {
                localStorage.removeItem(CONFIG_STORAGE_KEY);
                localStorage.removeItem(TASK_STORAGE_KEY);
            } catch (e) {}
            // 重新加载页面以恢复初始状态
            location.reload();
        }

        // ========== 提示词模板 ==========

        async function loadPromptTemplates() {
            try {
                const response = await fetch('/api/presets/prompts');
                const data = await response.json();
                const container = document.getElementById('presetPrompts');

                if (!data.prompts || data.prompts.length === 0) return;

                data.prompts.forEach(prompt => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'preset-btn';
                    button.textContent = prompt.name;
                    button.title = prompt.description || '';

                    button.onclick = () => {
                        document.getElementById('promptInput').value = prompt.prompt;
                        container.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');
                        saveConfigToStorage();
                    };

                    container.appendChild(button);
                });

                // 如果提示词框为空，默认选中第一个模板
                if (data.prompts && data.prompts.length > 0) {
                    const currentPrompt = document.getElementById('promptInput').value.trim();
                    if (!currentPrompt) {
                        const firstBtn = container.querySelector('.preset-btn');
                        if (firstBtn) firstBtn.click();
                    } else {
                        // 恢复配置时高亮匹配的提示词按钮
                        data.prompts.forEach((p, i) => {
                            if (p.prompt === currentPrompt) {
                                const btns = container.querySelectorAll('.preset-btn');
                                if (btns[i]) btns[i].classList.add('active');
                            }
                        });
                    }
                }
            } catch (error) {
                console.error('加载提示词模板失败:', error);
            }
        }

        async function loadImagePresets() {
            // 如果 <Picture 1> 已有内容（从保存的配置恢复），跳过
            if (uploadedImages[0]) return;
            try {
                const response = await fetch('/api/presets/images');
                const data = await response.json();
                if (!data.images || data.images.length === 0) return;

                const r = await fetch(`/api/presets/image/${encodeURIComponent(first.filename)}`);
                if (r.ok) {
                    const fileData = await r.json();

                        type: 'upload',

                        base64: fileData.base64,
                        preview: `/static/presets/images/${first.filename}`
                    };

        // ========== 预置参考音频 ==========

        async function loadAudioPresets() {
            // 如果 <Audio 1> 已有内容（从保存的配置恢复），跳过
            if (uploadedAudio[0]) return;
            try {
                const response = await fetch('/api/presets/audios');
                const data = await response.json();
                if (!data.audios || data.audios.length === 0) return;
                const first = data.audios[0];
                const r = await fetch(`/api/presets/audio/${encodeURIComponent(first.filename)}`);
                if (r.ok) {
                    const fileData = await r.json();
                    const mimeMap = {'.wav': 'audio/wav', '.mp3': 'audio/mpeg', '.ogg': 'audio/ogg', '.flac': 'audio/flac'};
                    const ext = first.filename.substring(first.filename.lastIndexOf('.'));
                    uploadedAudio[0] = {
                        type: 'upload',
                        filename: first.filename,
                        base64: fileData.base64,
                        mime_type: mimeMap[ext] || 'audio/wav'
                    };
                    updateAudioPreview();

                console.error('预置音频加载失败:', e);

        // ========== 文件上传处理 ==========

        function setupFileUploads() {
            document.getElementById('imageInput').addEventListener('change', handleImageUpload);
            document.getElementById('audioInput').addEventListener('change', handleAudioUpload);
            document.getElementById('videoInput').addEventListener('change', handleVideoUpload);
        }

        async function handleImageUpload(e) {
            const files = Array.from(e.target.files);

            for (const file of files) {
                // 使用点击的槽位，否则找第一个空槽位
                let targetSlot = activeImageSlot >= 0 ? activeImageSlot : uploadedImages.findIndex(img => img === null);
                if (targetSlot === -1 || uploadedImages[targetSlot] !== null) {
                    targetSlot = uploadedImages.findIndex(img => img === null);
                }
                if (targetSlot === -1) {
                    showStatus('所有9个图片槽位都已使用', 'error');
                    break;
                }

                const slotToFill = targetSlot;
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImages[slotToFill] = {
                        type: 'upload',
                        filename: file.name,
                        base64: event.target.result.split(',')[1],
                        preview: event.target.result
                    };
                    updateImageList();
                    showStatus(`✅ 已上传图片到 <Picture ${slotToFill + 1}>: ${file.name}`, 'success');
                    saveConfigToStorage();
                    closeImageSlotPicker();
                };
                reader.readAsDataURL(file);
            }
            // 清空 input 以便重复选择同一文件
            e.target.value = '';
        }

        // ========== 预览区域更新 ==========

        function updateImagesPreview() {
            const previewDiv = document.getElementById('selectedImagesPreview');
            if (!previewDiv) return;

            // 清空预览区
            previewDiv.innerHTML = '';

            // 显示9个固定槽位
            for (let i = 0; i < MAX_IMAGE_SLOTS; i++) {
                const img = uploadedImages[i];
                const thumb = document.createElement('div');
                thumb.className = 'preview-thumb';

                if (img) {
                    // 有图片的槽位 - 可点击预览
                    thumb.className = 'preview-thumb clickable';
                    thumb.style.cssText = 'position: relative; width: 60px; height: 60px; border-radius: 4px; overflow: hidden; border: 2px solid #667eea; background: #fff; cursor: pointer;';
                    thumb.onclick = (e) => {
                        if (e.target.tagName !== 'BUTTON') previewImage(i);
                    };
                    thumb.innerHTML = `
                        <img src="${img.preview}" style="width: 100%; height: 100%; object-fit: cover; pointer-events: none;" alt="${escapeHtml(img.filename)}">
                        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(102,126,234,0.85); color: white; font-size: 9px; text-align: center; padding: 1px 0; pointer-events: none;">&lt;Picture ${i + 1}&gt;</div>
                        <button type="button" onclick="event.stopPropagation(); removeImage(${i})" style="position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; border: none; background: #f44336; color: white; font-size: 14px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;">&times;</button>
                    `;
                } else {
                    // 空槽位 - 点击打开选择弹窗
                    thumb.style.cssText = 'position: relative; width: 60px; height: 60px; border-radius: 4px; overflow: hidden; border: 2px dashed #ccc; background: #f9f9f9; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;';
                    thumb.innerHTML = `
                        <div style="text-align: center; color: #999; font-size: 9px; pointer-events: none;">&lt;Picture ${i + 1}&gt;<br><span style="font-size: 16px;">+</span></div>
                    `;
                    thumb.onmouseenter = () => { thumb.style.borderColor = '#667eea'; thumb.style.background = '#f0f3ff'; };
                    thumb.onmouseleave = () => { thumb.style.borderColor = '#ccc'; thumb.style.background = '#f9f9f9'; };
                    thumb.onclick = () => openImageSlotPicker(i);
                }
                previewDiv.appendChild(thumb);
            }
        }

        function updateAudioPreview() {
            const previewDiv = document.getElementById('selectedAudioPreview');

        // ========== 预览弹窗功能 ==========

        function openPreviewModal(type, item, index) {
            const modal = document.getElementById('previewModal');
            const body = document.getElementById('previewModalBody');
            const title = document.getElementById('previewModalTitle');

            let content = '';
            let titleText = '';

            if (type === 'image') {
                titleText = `<Picture ${index + 1}> - ${item.filename}`;
                const src = item.type === 'upload'
                    ? 'data:image/jpeg;base64,' + item.base64
                    : `/api/browser/file?path=${encodeURIComponent(item.path)}`;
                content = `<img src="${src}" alt="${escapeHtml(item.filename)}">`;
            } else if (type === 'audio') {
                titleText = `<Audio ${index + 1}> - ${item.filename}`;
                const audioMime = item.mime_type || 'audio/mpeg';
                const src = item.type === 'upload'
                    ? `data:${audioMime};base64,` + item.base64
                    : `/api/browser/file?path=${encodeURIComponent(item.path)}`;
                const trim = audioTrim[index] || { start: 0, end: 3 };
                content = `
                    <div style="text-align:left; max-width:500px; margin:0 auto;">
                        <audio id="audioPreviewPlayer" controls style="width: 100%; margin-bottom: 12px;"><source src="${src}">您的浏览器不支持音频播放</audio>
                        <div style="background:#f8f9fa; border:1px solid #ddd; border-radius:8px; padding:12px;">
                            <div style="font-size:13px; font-weight:500; color:#333; margin-bottom:10px;">🎬 音频截取（默认截取前 3 秒）</div>
                            <div style="display:flex; gap:12px; align-items:center; margin-bottom:10px;">
                                <label style="font-size:12px; color:#555; display:flex; flex-direction:column; flex:1;">
                                    起始时间（秒）
                                    <input type="number" id="audioTrimStart" value="${trim.start}" min="0" step="0.1" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; margin-top:4px;">
                                </label>
                                <label style="font-size:12px; color:#555; display:flex; flex-direction:column; flex:1;">
                                    结束时间（秒）
                                    <input type="number" id="audioTrimEnd" value="${trim.end}" min="0" step="0.1" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; margin-top:4px;">
                                </label>
                            </div>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <button type="button" id="audioTrimPreviewBtn" style="padding:6px 12px; border:1px solid #667eea; background:white; color:#667eea; border-radius:4px; cursor:pointer; font-size:12px;">▶ 预览截取片段</button>
                                <button type="button" id="audioTrimApplyBtn" style="padding:6px 12px; border:1px solid #4CAF50; background:#4CAF50; color:white; border-radius:4px; cursor:pointer; font-size:12px;">✓ 应用截取</button>
                                <span id="audioTrimStatus" style="font-size:11px; color:#888;"></span>
                            </div>
                            <div id="audioTrimDuration" style="font-size:11px; color:#888; margin-top:6px;"></div>
                        </div>
                    </div>
                `;
            } else if (type === 'video') {
                titleText = `<Video ${index + 1}> - ${item.filename}`;
                const src = item.type === 'upload'
                    ? 'data:video/mp4;base64,' + item.base64
                    : `/api/browser/file?path=${encodeURIComponent(item.path)}`;
                content = `<video controls autoplay style="max-width: 100%; max-height: 80vh;"><source src="${src}">您的浏览器不支持视频播放</video>`;
            }

            body.innerHTML = content;
            title.textContent = titleText;
            modal.classList.add('show');

            // 音频裁剪按钮事件
            if (type === 'audio') {
                const player = document.getElementById('audioTrimPreviewBtn');
                const applyBtn = document.getElementById('audioTrimApplyBtn');
                const audioEl = document.querySelector('#audioPreviewPlayer');
                const trimStatus = document.getElementById('audioTrimStatus');
                const trimDuration = document.getElementById('audioTrimDuration');

                // 显示音频总时长
                if (audioEl) {
                    audioEl.addEventListener('loadedmetadata', () => {
                        const dur = audioEl.duration;
                        if (isFinite(dur)) {
                            trimDuration.textContent = `音频总时长: ${formatTimeMMSS(dur)} (${dur.toFixed(1)}秒)`;
                        }
                    });
                    audioEl.addEventListener('timeupdate', () => {
                        const startVal = parseFloat(document.getElementById('audioTrimStart').value) || 0;
                        const endVal = parseFloat(document.getElementById('audioTrimEnd').value) || 0;
                        if (endVal > 0 && audioEl.currentTime >= endVal) {
                            audioEl.pause();
                            audioEl.currentTime = startVal;
                        }
                    });
                }

                if (player) {
                    player.onclick = () => {
                        const startVal = parseFloat(document.getElementById('audioTrimStart').value) || 0;
                        const endVal = parseFloat(document.getElementById('audioTrimEnd').value) || 0;
                        if (audioEl && endVal > startVal) {
                            audioEl.currentTime = startVal;
                            audioEl.play();
                            trimStatus.textContent = `预览: ${formatTimeMMSS(startVal)} → ${formatTimeMMSS(endVal)}`;
                        } else {
                            trimStatus.textContent = '结束时间必须大于起始时间';
                        }
                    };
                }

                if (applyBtn) {
                    applyBtn.onclick = () => {
                        const startVal = parseFloat(document.getElementById('audioTrimStart').value) || 0;
                        const endVal = parseFloat(document.getElementById('audioTrimEnd').value) || 0;
                        if (endVal <= startVal) {
                            trimStatus.textContent = '结束时间必须大于起始时间';
                            return;
                        }
                        audioTrim[index] = { start: startVal, end: endVal };
                        trimStatus.textContent = `✓ 已应用: ${formatTimeMMSS(startVal)} → ${formatTimeMMSS(endVal)}`;
                        updateAudioPreview();
                        saveConfigToStorage();
                    };
                }
            }
        }

        async function handleAudioUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            let targetSlot = activeAudioSlot >= 0 ? activeAudioSlot : uploadedAudio.findIndex(a => a === null);
            if (targetSlot === -1 || uploadedAudio[targetSlot] !== null) {
                targetSlot = uploadedAudio.findIndex(a => a === null);
            }
            if (targetSlot === -1) {
                showStatus('所有3个音频槽位都已使用', 'error');
                e.target.value = '';
                return;
            }

            const slotToFill = targetSlot;
            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedAudio[slotToFill] = {
                    type: 'upload',
                    filename: file.name,
                    base64: event.target.result.split(',')[1]
                };

                updateAudioPreview();
                showStatus(`✅ 已上传音频到 <Audio ${slotToFill + 1}>: ${file.name}`, 'success');
                saveConfigToStorage();
                closeAudioSlotPicker();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        async function handleVideoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            let targetSlot = activeVideoSlot >= 0 ? activeVideoSlot : uploadedVideo.findIndex(v => v === null);
            if (targetSlot === -1 || uploadedVideo[targetSlot] !== null) {
                targetSlot = uploadedVideo.findIndex(v => v === null);
            }
            if (targetSlot === -1) {
                showStatus('所有3个视频槽位都已使用', 'error');
                e.target.value = '';
                return;
            }

            const slotToFill = targetSlot;
            const reader = new FileReader();
            reader.onload = (event) => {
                uploadedVideo[slotToFill] = {
                    type: 'upload',
                    filename: file.name,
                    base64: event.target.result.split(',')[1]
                };

                updateVideoPreview();
                showStatus(`✅ 已上传视频到 <Video ${slotToFill + 1}>: ${file.name}`, 'success');
                saveConfigToStorage();
                closeVideoSlotPicker();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        // ========== 状态显示 ==========

        function showStatus(message, type = 'info') {

            statusBox.className = `status show ${type}`;
        }

        // ========== 任务管理 ==========

        function updateTaskList() {
            const section = document.getElementById('taskListSection');
            const list = document.getElementById('taskList');

            list.innerHTML = '';

            if (activeTasks.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#999;padding:20px 0;font-size:13px;">📭 暂无任务，提交后会自动显示在这里</div>';
                return;
            }

            // 排序：活跃任务（pending/queued/processing）在前，已完成/失败/取消在后，组内按创建时间倒序
            const statusOrder = { pending: 0, queued: 1, processing: 2, completed: 3, failed: 4, cancelled: 5 };
            const sortedTasks = [...activeTasks].sort((a, b) => {
                const oa = statusOrder[a.status] ?? 9;
                const ob = statusOrder[b.status] ?? 9;
                if (oa !== ob) return oa - ob;
                // 同组内按创建时间倒序（新的在前）
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            sortedTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';

                const statusLabels = {
                    pending: comfyUIAvailable ? '⏸ 等待中' : '⏳ 等待 ComfyUI 启动',
                    queued: '⏳ 排队中',
                    processing: '⚙️ 处理中',
                    completed: '✅ 完成',
                    failed: '❌ 失败',
                    cancelled: '🚫 已取消'
                };

                const time = new Date(task.createdAt).toLocaleTimeString();
                const canCancel = task.status === 'pending' || task.status === 'queued' || task.status === 'processing';

                item.innerHTML = `
                    <span class="task-status-badge ${task.status}">${statusLabels[task.status] || task.status}</span>
                    <div class="task-info">
                        <div class="task-model">${escapeHtml(task.model)}</div>
                        <div class="task-prompt">${escapeHtml(task.prompt)}</div>
                        <div class="task-time">ID: ${task.id.substring(0, 8)}... | ${time}</div>
                        ${task.status === 'processing' && task.progress != null ? `<div style="margin-top:4px;"><div style="background:#e0e0e0;border-radius:3px;height:6px;overflow:hidden;"><div style="background:#667eea;height:100%;width:${task.progress}%;transition:width 0.3s;"></div></div><span style="font-size:10px;color:#666;">${task.progress}%</span></div>` : ''}
                        ${(() => {
                            const cp = task.comfyui_progress;
                            if (!cp || !task.status.match(/^(pending|queued|processing)$/)) return '';
                            if (cp.comfyui_status === 'running' && cp.comfyui_percent != null) {
                                const pct = cp.comfyui_percent;
                                const color = pct >= 80 ? '#4caf50' : pct >= 40 ? '#ff9800' : '#2196f3';
                                return `<div style="margin-top:4px;padding:4px 8px;background:#e3f2fd;border-radius:4px;border-left:3px solid #2196f3;">
                                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                                        <span style="font-size:10px;color:#1565c0;font-weight:500;">🎬 ComfyUI 执行中</span>
                                        <span style="font-size:10px;color:#1565c0;font-weight:600;">${pct}% (${cp.comfyui_current}/${cp.comfyui_total} 节点)</span>
                                    </div>
                                    <div style="background:#bbdefb;border-radius:3px;height:5px;overflow:hidden;">
                                        <div style="background:${color};height:100%;width:${pct}%;transition:width 0.5s;"></div>
                                    </div>
                                </div>`;
                            } else if (cp.comfyui_status === 'running') {
                                return `<div style="margin-top:4px;padding:4px 8px;background:#e3f2fd;border-radius:4px;border-left:3px solid #2196f3;font-size:10px;color:#1565c0;font-weight:500;">🎬 ComfyUI 执行中...</div>`;
                            } else if (cp.comfyui_status === 'queued') {
                                const posText = cp.comfyui_position ? `，第 ${cp.comfyui_position} 位` : '';
                                return `<div style="margin-top:4px;padding:4px 8px;background:#fff3e0;border-radius:4px;border-left:3px solid #ff9800;font-size:10px;color:#e65100;font-weight:500;">⏳ ComfyUI 排队中${posText}</div>`;
                            }
                            return '';
                        })()}
                        ${task.status === 'failed' && task.error ? (() => {
                            const isOom = /OOM_ERROR|显存不足|OutOfMemory/i.test(task.error);
                            let mainError = task.error;
                            let oomHint = '';
                            if (isOom) {
                                // 提取 OOM 提示（💥 开头到 \n\n 或结尾）
                                const m = task.error.match(/OOM_ERROR:\s*([\s\S]+)/);
                                oomHint = m ? m[1].trim() : '';
                                mainError = '';  // OOM 不显示原始错误
                            }
                            return `
                            <div class="task-error" style="margin-top:6px;padding:8px;background:${isOom ? '#fff3e0' : '#ffebee'};border-radius:4px;border-left:3px solid ${isOom ? '#ff9800' : '#f44336'};">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                                    <div style="font-size:11px;color:${isOom ? '#e65100' : '#c62828'};font-weight:500;">${isOom ? '💥 显存不足' : '❌ 任务失败'}</div>
                                    <button type="button" onclick="copyTaskError('${task.id}')" style="padding:2px 8px;border:1px solid #1976d2;background:white;color:#1976d2;border-radius:3px;cursor:pointer;font-size:10px;transition:all 0.2s;" onmouseover="this.style.background='#1976d2';this.style.color='white'" onmouseout="this.style.background='white';this.style.color='#1976d2'">📋 复制</button>
                                </div>
                                ${oomHint ? `<div style="font-size:11px;color:#e65100;font-weight:500;line-height:1.7;white-space:pre-wrap;">${escapeHtml(oomHint).replace(/\\n/g, '\n')}</div>` : ''}
                                ${mainError ? `<details style="margin-top:4px;"><summary style="font-size:10px;color:#888;cursor:pointer;">查看原始错误</summary><div class="task-error-text" style="font-size:10px;color:#555;word-break:break-all;max-height:120px;overflow-y:auto;line-height:1.4;white-space:pre-wrap;margin-top:4px;padding:6px;background:#f8f8f8;border-radius:3px;">${escapeHtml(mainError)}</div></details>` : ''}
                            </div>`;
                        })() : ''}
                    </div>
                    ${canCancel ? `<button type="button" class="task-cancel-btn" onclick="cancelTask('${task.id}')" style="padding: 4px 10px; border: 1px solid #f44336; background: white; color: #f44336; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: auto;">取消</button>` : ''}
                `;

                list.appendChild(item);
            });
        }

        function copyTaskError(taskId) {
            const task = activeTasks.find(t => t.id === taskId);
            if (!task || !task.error) {
                showStatus('❌ 没有找到错误信息', 'error');
                return;
            }

            // Create a temporary textarea to copy the text
            const textarea = document.createElement('textarea');
            textarea.value = task.error;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showStatus('✅ 错误信息已复制到剪贴板', 'success');
            } catch (err) {
                showStatus('❌ 复制失败，请手动选择复制', 'error');
                console.error('复制失败:', err);
            }

            document.body.removeChild(textarea);
        }

        async function cancelTask(taskId) {
